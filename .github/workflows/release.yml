name: release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the .ipa to App Store Connect"
        type: boolean
        default: false

env:
  BUNDLE_ID: ${{ vars.SOLSHOT_BUNDLE_ID }}
  TEAM_ID: ${{ vars.SOLSHOT_TEAM_ID }}

jobs:
  archive:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Unit tests (kernel + UI derivations)
        run: node --test test/solar.test.mjs test/solve.test.mjs test/ui.test.mjs

      - name: Bundle sanity check
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/export-check"

      - name: Install signing certificate
        env:
          P12_B64: ${{ secrets.DIST_P12_B64 }}
          P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          set -x
          printf '%s' "$P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p tmpass build.keychain || true
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p tmpass build.keychain
          security import "$RUNNER_TEMP/dist.p12" -k build.keychain -P "$P12_PASSWORD" -A -t cert -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k tmpass build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.PROFILE_MAIN_B64 }}
          PROFILE_UUID: ${{ secrets.PROFILE_MAIN_UUID }}
        run: |
          set -x
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PROFILE_B64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          ls -l "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_B64: ${{ secrets.ASC_KEY_B64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_B64" | base64 -d > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Guard app icon has no alpha (ITMS-90717)
        run: python3 .github/scripts/check_icon_alpha.py

      - name: Check the injected sources landed
        run: |
          set -x
          ls ios
          find ios -name "*.swift" -path "*AppIntents*" -print
          grep -rl "AppShortcutsProvider" ios --include="*.swift"
          grep -n "com.lixing.solshot" ios/*/Info.plist | head -5
          grep -n "solshot-deployment-floor" ios/Podfile

      - name: Archive
        env:
          PROFILE_UUID: ${{ secrets.PROFILE_MAIN_UUID }}
        run: |
          set -o pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/solshot.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" \
            2>&1 | tail -80

      - name: Export ipa
        env:
          PROFILE_UUID: ${{ secrets.PROFILE_MAIN_UUID }}
        run: |
          set -o pipefail
          echo "profile=$PROFILE_UUID bundle=$BUNDLE_ID"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_UUID</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/solshot.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" \
            2>&1 | tail -60
          ls -l "$RUNNER_TEMP/ipa" || true

      - name: Verify ipa contents
        run: |
          set -x
          IPA=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          echo "ipa=$IPA"
          rm -rf "$RUNNER_TEMP/ipa-x" && mkdir -p "$RUNNER_TEMP/ipa-x"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-x"
          APP=$(find "$RUNNER_TEMP/ipa-x/Payload" -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          plutil -p "$APP/Info.plist" | grep -Ei 'CFBundleIdentifier|CFBundleVersion|CFBundleShortVersionString|UIApplicationSceneManifest|Solshot' || true
          ls "$APP" | grep -Ei 'metadata|appintents|sun' || true
          du -sh "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null | head -20 || true


          echo "== app intents gate =="
          test -d "$APP/Metadata.appintents" || { echo "FAIL: no App Intents metadata in signed ipa"; exit 1; }
          ls -l "$APP/Metadata.appintents" || true
          for I in SunTimesIntent OpenSolshotIntent; do
            grep -raq "$I" "$APP/Metadata.appintents" || { echo "FAIL: intent $I not compiled into metadata"; exit 1; }
          done
          strings -a "$APP/Metadata.appintents"/* | grep -o "[A-Za-z]*Intent" | sort -u | head -25 || true
          echo "OK: parameterized app intents compiled into the bundle"

          echo "== apple-fm gate =="
          test -f modules/apple-fm/ios/AppleFMModule.swift || { echo "FAIL: apple-fm module source missing"; exit 1; }
          test -f src/appleAi.js || { echo "FAIL: src/appleAi.js missing"; exit 1; }
          grep -q "appleAi" App.js || { echo "FAIL: App.js does not use the on-device bridge"; exit 1; }
          ls -l modules/apple-fm/ios || true
          BIN=$(basename "$APP" .app)
          strings -a "$APP/$BIN" 2>/dev/null | grep -c "AppleFMModule" || echo "WARN: AppleFMModule symbol not found in main binary"
      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER }}
          ASC_KEY_B64: ${{ secrets.ASC_KEY_B64 }}
        run: |
          set -o pipefail
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_B64" | base64 -d > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          IPA=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          echo "ipa=$IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER" \
            --verbose 2>&1 | tail -40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solshot-release
          path: |
            ${{ runner.temp }}/ipa/**/*.ipa
          if-no-files-found: warn
          retention-days: 7
